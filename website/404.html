<!doctype html>
<html lang="en" class="js-off">
<head>

          <a class="btn btn-go" href="/download.html">Get DDM free</a>
          <a class="btn btn-store" href="/help/">Help</a>
          <a class="btn btn-store" href="/faq/">Questions people ask</a>
        </div>
        <svg class="comet" viewBox="0 0 400 400" aria-hidden="true"><use href="#comet"/></svg>
      </div>
    </section>
  </main>
  <!--@footer-->
</body>
