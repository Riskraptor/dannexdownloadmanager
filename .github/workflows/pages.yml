# Builds dannex.kavangi.co.ke (tools/website/build.py: website/, docs/, CHANGELOG.md and the
# language list, then every page again in each language of i18n/site/, tools/website/sitei18n.py)
# and publishes it with GitHub Pages, on every push to main that touches them, and
# once a day so the repository's star, fork and issue counts and its contributors (the home page,
# /contributors.html, the News page; tools/contributors.py) on the site stay current.
# While GitHub Pages is off for the repository (Settings → Pages → Source: GitHub Actions), the
# site is still built (a check of its pages) but not published, and the run says so.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "i18n/languages.tsv"
      - "i18n/site/**"
      - "tools/website/**"
      - "tools/contributors.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Read-only; only the deploy job may publish the site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # ask whether GitHub Pages is on
    outputs:
      pages: ${{ steps.pages.outputs.on }}
    steps:
      - name: Is GitHub Pages on?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Website built, not published::GitHub Pages is off for this repository. Turn it on in Settings, Pages, Source: GitHub Actions, then run this workflow again."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The site owner's own Statcounter project (repository variables); none set: no counter.
          MDM_STATCOUNTER_PROJECT: ${{ vars.STATCOUNTER_PROJECT }}
          MDM_STATCOUNTER_SECURITY: ${{ vars.STATCOUNTER_SECURITY }}
          # Dannex's own donation page (a repository variable); none set: no Sponsor links.
          MDM_SPONSORS_URL: ${{ vars.SPONSORS_URL }}
        run: |
          pip install markdown==3.10
          python tools/website/build.py
      - if: steps.pages.outputs.on == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: target/site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the built site
      id-token: write # prove to Pages that this run is the repository's
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
