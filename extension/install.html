<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title data-i18n="name"></title>
<link rel="stylesheet" href="pages.css">
</head>
<body class="page">
  <header class="page-head">
    <img src="icons/icon-48.png" width="24" height="24" alt="">
    <span class="eyebrow" data-i18n="name"></span>
  </header>
  <main>
    <section id="hero" class="hero wait" role="status" aria-live="polite">
      <span class="state-mark" aria-hidden="true"></span>
      <div>
        <h1 id="headline" data-i18n="page_checking"></h1>
        <p id="lead" class="lead"></p>
      </div>
    </section>
    <label id="toggle-row" class="card switch-row" hidden>
      <span class="switch-text" data-i18n="popup_take"></span>
      <input id="toggle" type="checkbox" role="switch">
    </label>
    <section id="get" class="card get" hidden>
      <a id="download" class="button primary big" target="_blank" rel="noopener" data-i18n="page_download"></a>
      <p id="download-files" class="note"></p>
      <a id="all-downloads" class="link" target="_blank" rel="noopener" data-i18n="page_all_downloads"></a>
    </section>
    <ol id="steps" class="steps" hidden></ol>
    <p id="already" class="note" data-i18n="page_step_installed" hidden></p>
    <div id="actions" class="actions">
      <button id="retry" class="primary" data-i18n="page_try_again" hidden></button>
      <button id="app-options" class="primary" data-i18n="page_app_options" hidden></button>
      <button id="remove" class="primary" data-i18n="page_remove" hidden></button>
      <button id="extensions" data-i18n="page_extensions" hidden></button>
    </div>
    <ul id="notes" class="notes"></ul>
  </main>
  <footer>
    <span class="footer-links">
      <a id="help" class="link" data-i18n="popup_help" target="_blank" rel="noopener"></a>
      <a id="support" class="link" data-i18n="page_support" target="_blank" rel="noopener"></a>
    </span>
    <span id="version"></span>
  </footer>
  <script src="pages.js"></script>
  <script src="install.js"></script>
</body>
</html>
