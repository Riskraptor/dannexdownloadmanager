<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title data-i18n="name"></title>
<link rel="stylesheet" href="pages.css">
</head>
<body class="popup">
  <header class="page-head">
    <img src="icons/icon-48.png" width="20" height="20" alt="">
    <span class="eyebrow" data-i18n="name"></span>
  </header>
  <main>
    <section id="hero" class="hero wait" role="status" aria-live="polite">
      <span class="state-mark" aria-hidden="true"></span>
      <div>
        <h1 id="headline" data-i18n="page_checking"></h1>
        <p id="lead" class="lead"></p>
      </div>
    </section>
    <label id="toggle-row" class="card switch-row" hidden>
      <span class="switch-text" data-i18n="popup_take"></span>
      <input id="toggle" type="checkbox" role="switch">
    </label>
    <button id="fix" class="primary wide" data-i18n="popup_fix" hidden></button>
    <nav id="page-actions" class="menu" hidden>
      <button id="video" data-i18n="popup_video"></button>
      <button id="all" data-i18n="popup_all"></button>
      <p id="said" class="note" role="status"></p>
    </nav>
    <nav class="menu">
      <button id="status" data-i18n="popup_status"></button>
      <button id="options" data-i18n="popup_options"></button>
    </nav>
  </main>
<script src="pages.js"></script>
<script src="popup.js"></script>
</body>
</html>
